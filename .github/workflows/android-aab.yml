# Gera o App Bundle (.aab) assinado do ValleyBlocks para enviar ao Play Console.
# Só roda manualmente (Actions > Android AAB > Run workflow). Precisa dos secrets do repositório:
#   ANDROID_KEYSTORE_BASE64  (o .jks da chave de upload em base64)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# versionCode = 100 + número da execução (sempre maior que o anterior, como a Play exige).
name: Android AAB

on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            game/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: |
          npm ci --prefix game
          npm ci --prefix mobile

      - name: Construir o jogo (Vite)
        run: npm run build --prefix game

      - name: Copiar o build para o app (cap sync)
        working-directory: mobile
        run: npx cap sync android

      - name: Chave de upload
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Faltam os secrets ANDROID_KEYSTORE_* do repositório"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/valleyblocks-upload.jks
          printf 'storeFile=keystore/valleyblocks-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Compilar App Bundle assinado
        working-directory: mobile/android
        run: |
          export VERSION_CODE=$((100 + ${{ github.run_number }}))
          export VERSION_NAME=$(node -p "require('../../game/package.json').version")
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Renomear AAB
        run: |
          NAME="ValleyBlocks-${VERSION_NAME}-${VERSION_CODE}.aab"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "$NAME"
          echo "AAB_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}
          path: ${{ env.AAB_NAME }}
          retention-days: 30
