    <path d="M82 153h40" stroke="#c77548" stroke-width="4"/>
    <text x="136" y="160" font-size="14" font-weight="700" letter-spacing="3.4">SEU MUNDO. NO SEU TEMPO.</text>
    <text x="76" y="270" font-size="78" font-weight="800" letter-spacing="-4">VALE DOS</text>
    <text x="75" y="370" font-size="108" font-weight="800" letter-spacing="-5">BLOCOS<tspan fill="#cc7950">.</tspan></text>
    <text x="83" y="422" font-size="23" fill="#70806b">Um lugar para chamar de seu.</text>
    <text x="83" y="473" font-size="17" fill="#7c856f">Construa seu lar. Faça novos amigos.</text>
    <text x="83" y="500" font-size="17" fill="#7c856f">Descubra o que há além da estrada.</text>
