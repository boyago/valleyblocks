    <text x="105" y="581" font-size="14" font-weight="700" letter-spacing="1.2" fill="#faf6e8">UM MUNDO PARA CRIAR</text>
    <text x="82" y="643" font-size="12" font-weight="700" letter-spacing="2.5" fill="#8a9078">EXPLORAR · CONSTRUIR · CUIDAR</text>
    <text x="1188" y="643" text-anchor="end" font-size="12" font-weight="700" letter-spacing="2.1" fill="#819074">SANDBOX 3D / 01</text>
